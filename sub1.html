            <main>
                <div class = "sub1_content">
                    <p>풋살은 <b>FIFA</b>가 공인한 <b>5인제</b> 실내 축구입니다.<br>좁은 공간에서의 빠르고 정교한 플레이는기술과 순발력을 극대화하며,<br>모든 연령층에게 인기 있는 스포츠입니다.<br><br><br>1930년 우루과이에서 시작된 풋살은<br><b>브라질</b>을 중심으로 세계 전역으로 확산되었으며,<br>FIFA 풋살 월드컵 등 다양한 국제 대회가<br>정기적으로 개최되고 있습니다.</p>
                </div>
