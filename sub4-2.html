<!DOCTYPE html>
<html>
    <head>
        <title>Kiosk Sub 4 - 2 Page</title>
        <meta charset = "UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel = "stylesheet" type = "text/css" href = "style.css">
    </head>

    <body>
        <div class = "kiosk-wrapper">
            <!-- 본 화면 -->
            <div class = "sub-frame">
                <header>
                    <img src = "image/adidas2.png" class = "logo">
                    <div class = "page-title">F50</div>
                </header>

                <main>
                    <div class = "carousel-frame">
                        <img id = "carousel-left" class = "carousel-arrow left" src = "image/arrow_left.png" alt = "prev">
                        <img id = "carousel-image" class = "carousel-img" src = "image/f501.png" alt = "F50 TF">
                        <img id = "carousel-right" class = "carousel-arrow right" src = "image/arrow_right.png" alt = "next">
                    </div>

                    <div class = "carousel-indicators" id = "carousel-indicators"></div>

                    <div class = "f50-text">
                        <h2>터프 구장에서 라이벌을 압도하는 플레이를 이끌어 줄 풋살화</h2>
                        <p>압도적인 스피드를 위해 탄생한 가벼운 아디다스 F50와 함께 속도의 한계에 도전해보세요.
                            가벼운 파이버터치 갑피를 둘러싼 스프린트웹 3D 텍스처가 볼을 밀착시켜 보다 빠른 드리블을 이끌고 컴프레션 핏 터널 설포가 발을 흔들림 없이 잡아줍니다.
                            고무 돌기 아웃솔 상단에 탑재된 라이트스트라이크 미드솔의 우수한 반발력으로 인조 잔디에서 최상의 플레이를 펼칠 수 있습니다.<br>
                            최소 20% 이상의 재활용 소재가 사용된 제품입니다.
                        </p>
                    </div>

                </main>

                <footer>
                    <div class = "footer-bar">
                        <button class = "footer-btn" id = "back-btn" onclick = "history.back()"><img src = "image/arrow_back.png"></button>
                        <button class = "footer-btn" id = "home-btn" onclick = "location.href = 'main.html'"><img src = "image/home.png"></button>
                        <button class = "footer-btn" id = "menu-btn" onclick = "openMenu()"><img src = "image/menu.png"></button>
                    </div>
                </footer>
            </div>

            <script src = "scripts/carousel.js"></script>
            <script>
                const f50Images = [
                    "image/f501.png",
                    "image/f502.png",
                    "image/f503.png",
                    "image/f504.png",
                    "image/f505.png",
                    "image/f506.png",
                    "image/f507.png",
                    "image/f508.png",
                    "image/f509.png",
                    "image/f5010.png"
                ];

                createCarousel(f50Images);
            </script>

            <div class="menu-frame">
                <div id="menu-overlay" class="menu-overlay" onclick="closeMenu()"></div>
                <aside id="side-menu" class="side-menu">
                    <div class="menu-top" onclick="closeMenu()">
                        <button class="menu-close-btn" id="menu-close-btn">&#10005;</button>
                    </div>
                    <button class="menu-item main-btn" onclick="goTo('main.html')">메인화면</button>
                    <button class="menu-item intro-btn" onclick="goTo('sub1.html')">풋살소개</button>
                    <button class="menu-item rule-btn" onclick="goTo('sub2.html')">규칙</button>
                    <button class="menu-item char-btn" onclick="goTo('sub3.html')">특징</button>
                    <button class="menu-item shoe-btn" onclick="goTo('sub4.html')">풋살화</button>
                    <button class="menu-item subshoe1-btn" onclick="goTo('sub4-1.html')">● Predator</button>
                    <button class="menu-item subshoe2-btn" onclick="goTo('sub4-2.html')">● F50</button>
                    <button class="menu-item subshoe3-btn" onclick="goTo('sub4-3.html')">● Copa</button>
                    <button class="menu-item reserve-btn" onclick="goTo('sub5.html')">경기예약</button>
                </aside>
            </div>
        </div>

        <script src = "scripts/timeout.js"></script>
        <script src = "scripts/menu.js"></script>
    </body>
</html>
