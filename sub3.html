<!DOCTYPE html>
<html>
    <head>
        <title>Kiosk Sub 3 Page</title>
        <meta charset = "UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel = "stylesheet" type = "text/css" href = "style.css">
    </head>

    <body>
        <div class = "sub-frame">
            <header>
                <img src = "image/adidas2.png" class = "logo">
                <div class = "page-title">특징</div>
            </header>

            <main>
                <div class = "icon-text-list-sub3">
                    <div class = "icon-text-item">
                        <img src = "image/icon1.png" alt = "icon1" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>인원 부담 없이</b></div>
                            <div class = "char-text">3:3부터 7:7까지, 적은 인원으로도 충분합니다.</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon2.png" alt = "icon2" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>끊김없이</b></div>
                            <div class = "char-text">오프사이드와 교체 제한이 없습니다.</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon3.png" alt = "icon3" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>좁은 공간, 화려한 개인기</b></div>
                            <div class = "char-text">축구보다 작은 경기장에서 개인기를 펼치세요.</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon4.png" alt = "icon4" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>짧고 강렬한 경기</b></div>
                            <div class = "char-text">짧은 시간 안에 몰아치세요.</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon5.png" alt = "icon5" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>풋살에 최적화된 장비</b></div>
                            <div class = "char-text">아디다스 풋살화로 최고의 퍼포먼스를 펼치세요.</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon6.png" alt = "icon6" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>날씨 제약 없이</b></div>
                            <div class = "char-text">실내에서도 가능합니다.</div>
                        </div>
                    </div>
                </div>
            </main>

            <footer>
                <div class = "footer-bar">
                    <button class = "footer-btn" id = "back-btn" onclick = "history.back()"><img src = "image/arrow_back.png"></button>
                    <button class = "footer-btn" id = "home-btn" onclick = "location.href = 'main.html'"><img src = "image/home.png"></button>
                    <button class = "footer-btn" id = "menu-btn"><img src = "image/menu.png"></button>
                </div>
            </footer>
        </div>
    </body>
</html>
