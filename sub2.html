<!DOCTYPE html>
<html>
    <head>
        <title>Kiosk Sub 2 Page</title>
        <meta charset = "UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel = "stylesheet" type = "text/css" href = "style.css">
    </head>

    <body>
        <div class = "sub-frame">
            <header>
                <img src = "image/adidas2.png" class = "logo">
                <div class = "page-title">규칙</div>
            </header>

            <main>
                <div class = "icon-text-list-sub2">
                    <div class = "icon-text-item">
                        <img src = "image/icon.png" alt = "icon1" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>경기 인원</b></div>
                            <div>5명 vs 5명</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon(1).png" alt = "icon2" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>경기 시간</b></div>
                            <div>전후반 20분</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon(6).png" alt = "icon3" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>경기장</b></div>
                            <div>축구장의 1/5 크기</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon(2).png" alt = "icon4" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>교체</b></div>
                            <div>무제한</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon(3).png" alt = "icon5" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>반칙</b></div>
                            <div>5회 누적 시 프리킥</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon(4).png" alt = "icon6" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>공 나가면</b></div>
                            <div>킥인으로 재개</div>
                        </div>
                    </div>
                    <div class = "icon-text-item">
                        <img src = "image/icon(5).png" alt = "icon1" class = "icon-img">
                        <div class = "icon-text">
                            <div><b>골키퍼 규칙</b></div>
                            <div>4초 이상 공 소유, 롱킥 불가</div>
                        </div>
                    </div>
                </div>
            </main>

            <footer>
                <div class = "footer-bar">
                    <button class = "footer-btn" id = "back-btn"><img src = "image/arrow_back.png"></button>
                    <button class = "footer-btn" id = "home-btn"><img src = "image/home.png"></button>
                    <button class = "footer-btn" id = "menu-btn"><img src = "image/menu.png"></button>
                </div>
            </footer>
        </div>
    </body>
</html>
