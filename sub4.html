<!DOCTYPE html>
<html>
    <head>
        <title>Kiosk Sub 4 Page</title>
        <meta charset = "UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel = "stylesheet" type = "text/css" href = "style.css">
    </head>

    <body>
        <div class = "sub-frame">
            <header>
                <img src = "image/adidas2.png" class = "logo">
                <div class = "page-title">풋살화</div>
            </header>

            <main>
                <button class = "sub4-btn">
                    <img src = "image/predatortf_black.png" class = "btn-img" alt = "imgae2">
                    <div class = "btn-text-box">
                        <div class = "btn-text-main">Predator TF</div>
                        <div class = "btn-text-sub">강력한 그립과 안정성으로 정교한 슈팅</div>
                    </div>
                </button>
                <button class = "sub4-btn">
                    <img src = "image/f50tf_black.png" class = "btn-img" alt = "image2">
                    <div class = "btn-text-box">
                        <div class = "btn-text-main">F50 TF</div>
                        <div class = "btn-text-sub">가벼움과 뛰어난 반발력으로 최상의 스피드</div>
                    </div>
                </button>
                <button class = "sub4-btn">
                    <img src = "image/copatf_black.png" class = "btn-img" alt = "image2">
                    <div class = "btn-text-box">
                        <div class = "btn-text-main">Copa TF</div>
                        <div class = "btn-text-sub">편안한 착용감과 정밀한 터치로 완벽한 플레이</div>
                    </div>
                </button>
            </main>

            <footer>
                <div class = "footer-bar">
                    <button class = "footer-btn" id = "back-btn"><img src = "image/arrow_back.png"></button>
                    <button class = "footer-btn" id = "home-btn"><img src = "image/home.png"></button>
                    <button class = "footer-btn" id = "menu-btn"><img src = "image/menu.png"></button>
                </div>
            </footer>
        </div>
    </body>
</html>
